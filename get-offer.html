<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />
    <title>Get offer</title>
</head>
<body style="height: 100vh; width: 100%; display: flex; flex-direction: column; margin: 0; overflow: hidden;">
  <main style="height: 100%;">
      <div id="synaps-container" style="height: 100%; padding: 10px;">
      </div>
  </main>
  <script type="module">
    // const urlParams = new URLSearchParams(window.location.search);
    // const did = urlParams.get("did");

    const textContainer = document.getElementById("synaps-container")

    const clientType = "Iden3MobileServiceV1";
    const timeout = 3000;

    const response = await fetch(`${window.location.origin}/offers`);
    const message = await response.json();

    const callParentHandler = (message1) => {
      const message = JSON.stringify(message1)
      console.log("Message in function Parent:", message)
      console.log("Type of message in function Parent:", typeof(message))
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler("iden3comm", message);
      }

      if (window.parent) {
        window.parent.postMessage({ type: "iden3comm", payload: message }, "*");
      }
    }

    if (message) { 
      callParentHandler(message)
    } else {
      console.log("Message undefined...")
    }


  </script>
</body>
</html>
